version: "3.9"

services:
  backend:
    image: kshitij2511/naka-backend:${IMAGE_VERSION}
    container_name: naka-backend
    restart: always
    ports:
      - "5000:5000"

  frontend:
    image: kshitij2511/naka-frontend:${IMAGE_VERSION}
    container_name: naka-frontend
    restart: always
    ports:
      - "5173:5173"

  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
