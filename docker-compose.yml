services:

  mongodb:
    image: mongo:6
    container_name: naka-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - naka-network

  backend:
    image: kshitij2511/naka-backend:${IMAGE_VERSION}
    container_name: naka-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/naka
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CLIENT_URL=http://13.48.130.59:5173
    networks:
      - naka-network

  frontend:
    image: kshitij2511/naka-frontend:${IMAGE_VERSION}
    container_name: naka-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://13.48.130.59:5000/api
    networks:
      - naka-network

volumes:
  mongo_data:


networks:
  naka-network:
    driver: bridge
